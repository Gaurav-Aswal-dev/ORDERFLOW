<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Continuous Bidding</title><link rel="stylesheet" href="/static/styles.css"><style>.wrap{max-width:1100px;margin:30px auto;padding:20px}.panel{padding:22px;margin:16px 0}.formrow{display:flex;gap:10px;flex-wrap:wrap}.formrow input,.formrow select{padding:10px;border-radius:8px;min-width:130px}.tables{display:grid;grid-template-columns:1fr 1fr;gap:15px}table{width:100%;border-collapse:collapse}td,th{padding:8px;border-bottom:1px solid #27314b;text-align:left}@media(max-width:700px){.tables{grid-template-columns:1fr}}</style></head><body><main class="wrap"><a href="/">← Main dashboard</a><header><h1>Continuous Bidding</h1><p>Multi-stock price-time priority book. Simulation only, no real money.</p></header><section class="panel"><h2>Submit order</h2><form id="order" class="formrow"><input id="symbol" list="symbols" value="RELIANCE" required><datalist id="symbols"><option>RELIANCE</option><option>ICICIBANK</option><option>TATAMOTORS</option><option>TCS</option></datalist><select id="side"><option>BUY</option><option>SELL</option></select><input id="price" type="number" min="0.01" step="0.01" value="100" required><input id="qty" type="number" min="1" step="1" value="5" required><button>Submit</button></form><p id="msg"></p></section><section class="panel"><form id="load" class="formrow"><input id="lookup" value="RELIANCE"><button>Load book</button></form><div class="tables"><div><h3>Bids</h3><table><thead><tr><th>Order</th><th>Price</th><th>Qty</th><th></th></tr></thead><tbody id="buys"></tbody></table></div><div><h3>Asks</h3><table><thead><tr><th>Order</th><th>Price</th><th>Qty</th><th></th></tr></thead><tbody id="sells"></tbody></table></div></div></section><section class="panel"><h2>Recent executions</h2><table><thead><tr><th>ID</th><th>Symbol</th><th>Price</th><th>Qty</th></tr></thead><tbody id="trades"></tbody></table></section></main><script>
const $=id=>document.getElementById(id);async function api(p,o={}){let r=await fetch(p,{headers:{'Content-Type':'application/json'},...o}),d=await r.json();if(!r.ok)throw Error(d.detail||'Request failed');return d}async function load(){let s=$('lookup').value.toUpperCase(),b=await api('/api/continuous/'+s+'/book');for(let side of ['buys','sells'])$(side).innerHTML=b[side].map(x=>`<tr><td>${x.order_id}</td><td>${x.price}</td><td>${x.quantity}</td><td><button onclick="cancelOrder(${x.order_id})">Cancel</button></td></tr>`).join('')||'<tr><td colspan=4>Empty</td></tr>';let t=await api('/api/continuous/trades?symbol='+s);$('trades').innerHTML=t.trades.map(x=>`<tr><td>${x.trade_id}</td><td>${x.symbol}</td><td>${x.price}</td><td>${x.quantity}</td></tr>`).join('')||'<tr><td colspan=4>No executions</td></tr>'}async function cancelOrder(id){try{await api('/api/continuous/orders/'+id+'/cancel',{method:'POST'});await load()}catch(e){alert(e.message)}}$('order').onsubmit=async e=>{e.preventDefault();try{let d=await api('/api/continuous/orders',{method:'POST',body:JSON.stringify({symbol:$('symbol').value,side:$('side').value,price:+$('price').value,quantity:+$('qty').value})});$('msg').textContent=`${d.status} · order #${d.order_id} · remaining ${d.remaining}`;$('lookup').value=d.symbol;await load()}catch(e){$('msg').textContent=e.message}};$('load').onsubmit=e=>{e.preventDefault();load()};load();
</script></body></html>
