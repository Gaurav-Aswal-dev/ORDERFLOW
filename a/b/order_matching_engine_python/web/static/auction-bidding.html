<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Auction Bidding</title><link rel="stylesheet" href="/static/styles.css"><style>.wrap{max-width:1100px;margin:30px auto;padding:20px}.panel{padding:22px;margin:16px 0}.formrow{display:flex;gap:10px;flex-wrap:wrap}.formrow input{padding:10px;border-radius:8px;min-width:130px}table{width:100%;border-collapse:collapse}td,th{padding:8px;border-bottom:1px solid #27314b;text-align:left}</style></head><body><main class="wrap"><a href="/">← Main dashboard</a><header><h1>Auction Bidding</h1><p>Create stock auctions, compete with bids, and inspect winners. Simulated only.</p></header><section class="panel"><h2>Create auction</h2><form id="create" class="formrow"><input id="symbol" list="symbols" value="RELIANCE" required><datalist id="symbols"><option>RELIANCE</option><option>ICICIBANK</option><option>TATAMOTORS</option><option>TCS</option></datalist><input id="title" value="Reliance demo auction" required><input id="start" type="number" min="0.01" step="0.01" value="100" required><input id="duration" type="number" min="1" max="10080" value="60" required><button>Create</button></form><p id="msg"></p></section><section class="panel"><h2>Auctions</h2><button onclick="refresh()">Refresh</button><table><thead><tr><th>ID</th><th>Stock</th><th>Title</th><th>Status</th><th>Top bid</th><th>Winner</th><th>Actions</th></tr></thead><tbody id="auctions"></tbody></table></section><section class="panel"><h2>Selected auction / bid</h2><form id="bid" class="formrow"><input id="aid" type="number" placeholder="Auction ID" required><input id="bidder" placeholder="Bidder name" required><input id="amount" type="number" min="0.01" step="0.01" placeholder="Bid amount" required><button>Place bid</button><button type="button" onclick="closeAuction()">Close auction</button></form><p id="bidmsg"></p><div id="detail"></div></section></main><script>
const $=id=>document.getElementById(id);async function api(p,o={}){let r=await fetch(p,{headers:{'Content-Type':'application/json'},...o}),d=await r.json();if(!r.ok)throw Error(d.detail||'Request failed');return d}async function refresh(){let d=await api('/api/auctions');$('auctions').innerHTML=d.auctions.map(a=>`<tr><td>${a.auction_id}</td><td>${a.symbol}</td><td>${a.title}</td><td>${a.status}</td><td>${a.winning_bid??'—'}</td><td>${a.winner??'—'}</td><td><button onclick="selectAuction(${a.auction_id})">Select</button></td></tr>`).join('')||'<tr><td colspan=7>No auctions</td></tr>'}async function selectAuction(id){$('aid').value=id;let a=await api('/api/auctions/'+id);$('detail').innerHTML=`<p><b>${a.symbol}</b> · ${a.title} · ${a.status} · closes ${a.ends_at}</p><p>Highest: ${a.winner||'—'} ${a.winning_bid??''}</p><h3>Bid history</h3><ul>${a.bids.map(b=>`<li>${b.bidder}: ${b.amount}</li>`).join('')||'<li>No bids yet</li>'}</ul>`}async function closeAuction(){try{await api('/api/auctions/'+$('aid').value+'/close',{method:'POST'});await selectAuction($('aid').value);await refresh()}catch(e){$('bidmsg').textContent=e.message}}$('create').onsubmit=async e=>{e.preventDefault();try{let a=await api('/api/auctions',{method:'POST',body:JSON.stringify({symbol:$('symbol').value,title:$('title').value,starting_price:+$('start').value,duration_minutes:+$('duration').value})});$('msg').textContent='Created auction #'+a.auction_id;$('aid').value=a.auction_id;await refresh();await selectAuction(a.auction_id)}catch(e){$('msg').textContent=e.message}};$('bid').onsubmit=async e=>{e.preventDefault();try{await api('/api/auctions/'+$('aid').value+'/bids',{method:'POST',body:JSON.stringify({bidder:$('bidder').value,amount:+$('amount').value})});$('bidmsg').textContent='Bid accepted';await selectAuction($('aid').value);await refresh()}catch(e){$('bidmsg').textContent=e.message}};refresh();
</script></body></html>
